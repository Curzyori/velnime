<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="50%" stop-color="#0F0F1A"/>
      <stop offset="100%" stop-color="#080810"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E2E4A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1A1A2E" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Primary Orange Gradient -->
    <linearGradient id="primary-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C38"/>
      <stop offset="50%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#E04800"/>
    </linearGradient>

    <!-- Light Orange Page Layer -->
    <linearGradient id="orange-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA054"/>
      <stop offset="100%" stop-color="#FF6B1A"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="accent-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80F2FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <!-- Dark Cutout Surface -->
    <linearGradient id="dark-cutout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252540"/>
      <stop offset="100%" stop-color="#151525"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neon-glow-orange" x1="-20%" y1="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="neon-glow-cyan" x1="-30%" y1="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Ambient Backlight -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B1A" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F0F1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad-dark)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#border-grad-dark)" stroke-width="2"/>

  <!-- Backdrop Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#ambient-glow)"/>

  <!-- Animation Speed Lines Effect -->
  <g opacity="0.07" stroke="#F1F5F9" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="256" x2="60" y2="60"/>
    <line x1="256" y1="256" x2="452" y2="60"/>
    <line x1="256" y1="256" x2="30" y2="256"/>
    <line x1="256" y1="256" x2="482" y2="256"/>
    <line x1="256" y1="256" x2="90" y2="430"/>
    <line x1="256" y1="256" x2="422" y2="430"/>
  </g>

  <!-- MAIN LOGO MARK: "V" Emblem -->
  <g transform="translate(0, 8)">

    <!-- LEFT WING: Layered Animation Frames -->
    <path d="M 124 138 C 124 138, 172 260, 226 352 L 182 352 C 142 278, 100 182, 100 182 Z" fill="url(#primary-orange)" opacity="0.85"/>
    <path d="M 152 124 C 152 124, 196 240, 244 380 L 204 380 C 166 268, 126 156, 126 156 Z" fill="url(#orange-light)"/>
    <path d="M 184 110 C 184 110, 222 230, 256 408 L 222 408 C 190 270, 154 138, 154 138 Z" fill="url(#primary-orange)" filter="url(#neon-glow-orange)"/>

    <!-- RIGHT WING: Anime Action Energy Blade -->
    <path d="M 328 110 L 358 138 C 328 238, 288 338, 256 408 L 242 384 C 272 310, 306 200, 328 110 Z" fill="url(#primary-orange)"/>
    <path d="M 366 138 L 394 168 C 360 250, 320 330, 280 390 L 258 390 C 292 330, 332 240, 366 138 Z" fill="url(#dark-cutout)" stroke="#FF6B1A" stroke-width="1.5"/>

    <!-- CENTERPIECE: Play Triangle Core -->
    <polygon points="214,196 214,308 308,252" fill="#0F0F1A"/>
    <polygon points="220,204 220,300 300,252" fill="url(#primary-orange)"/>
    <polygon points="228,218 228,286 284,252" fill="url(#accent-cyan-grad)"/>

    <!-- Dynamic Speed Slash across Play Button -->
    <path d="M 200 236 L 320 220 L 310 232 L 190 248 Z" fill="#0F0F1A" opacity="0.9"/>

    <!-- TOP ACCENT: Anime Sparkle Star -->
    <g transform="translate(386, 106)" filter="url(#neon-glow-cyan)">
      <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="url(#accent-cyan-grad)"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    </g>

    <!-- Bottom Vertex Glow Dot -->
    <circle cx="256" cy="408" r="7" fill="url(#accent-cyan-grad)" filter="url(#neon-glow-cyan)"/>
  </g>
</svg>
