<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <rect width="540" height="960" fill="#0F0F1A"/>
  <!-- player area (16:9) -->
  <rect x="0" y="0" width="540" height="304" fill="#000000"/>
  <circle cx="270" cy="152" r="52" fill="#FFFFFF" opacity="0.9"/>
  <path d="M255 130 l34 22 -34 22 z" fill="#0F0F1A"/>
  <!-- top overlay -->
  <path d="M40 64 l-14 14 14 14" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="330" y="78" font-family="sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF">1080p</text>
  <rect x="412" y="58" width="56" height="26" rx="13" fill="#FF6B1A"/>
  <text x="424" y="76" font-family="sans-serif" font-weight="bold" font-size="15" fill="#0F0F1A">HD</text>
  <!-- progress bar -->
  <rect x="0" y="276" width="540" height="6" fill="#33334D"/>
  <rect x="0" y="276" width="260" height="6" fill="#FF6B1A"/>
  <!-- controls -->
  <text x="28" y="360" font-family="sans-serif" font-weight="bold" font-size="24" fill="#FFFFFF">Solo Leveling</text>
  <text x="28" y="392" font-family="sans-serif" font-size="17" fill="#CFCFDD">Episode 1</text>
  <g stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M70 470 l-10 10 10 10" />
    <path d="M90 470 l-10 10 10 10" />
  </g>
  <rect x="130" y="450" width="24" height="40" rx="4" fill="#FF6B1A"/>
  <rect x="168" y="450" width="24" height="40" rx="4" fill="#FF6B1A"/>
  <path d="M216 452 h40 v20 h-40 z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  <path d="M264 452 h12 v40 h-12 z" fill="#FFFFFF"/>
  <path d="M286 452 h12 v40 h-12 z" fill="#FFFFFF"/>
  <g stroke="#FFFFFF" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M380 470 l10 -10 10 10" />
    <path d="M400 470 l10 -10 10 10" />
  </g>
  <!-- quality chips -->
  <rect x="28" y="560" width="90" height="40" rx="20" fill="#1A1A2E" stroke="#FF6B1A"/>
  <text x="52" y="585" font-family="sans-serif" font-weight="bold" font-size="16" fill="#FF6B1A">1080p</text>
  <rect x="128" y="560" width="80" height="40" rx="20" fill="#1A1A2E"/>
  <text x="150" y="585" font-family="sans-serif" font-size="16" fill="#CFCFDD">720p</text>
  <rect x="218" y="560" width="80" height="40" rx="20" fill="#1A1A2E"/>
  <text x="240" y="585" font-family="sans-serif" font-size="16" fill="#CFCFDD">480p</text>
  <!-- like / dislike -->
  <path d="M240 700 l0 -18 a10 10 0 0 1 20 0 l0 18 z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M236 700 h28 v18 h-28 z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M260 736 l-8 8 a6 6 0 0 1 -10 -4 l0 -14 h24" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M280 700 h28 v18 h-28 z" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M284 736 l8 8 a6 6 0 0 0 10 -4 l0 -14 h-24" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <text x="220" y="790" font-family="sans-serif" font-size="17" fill="#CFCFDD">Suka episode ini?</text>
</svg>
